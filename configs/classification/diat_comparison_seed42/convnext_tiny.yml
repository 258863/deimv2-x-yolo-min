data:
  root: datasets/DIAT-uSAT
  manifest: manifest.csv
  preprocessing: diat
  image_size: [288, 384]
  batch_size: 16
  num_workers: 4
  loader_seed: 42
model:
  architecture: convnext_tiny
  weights_path: ckpts/torchvision_imagenet1k/convnext_tiny-983f1562.pth
  weights_name: ConvNeXt_Tiny_Weights.IMAGENET1K_V1
pretraining:
  dataset: ImageNet-1K
  implementation: torchvision.models.convnext_tiny
  weights: ConvNeXt_Tiny_Weights.IMAGENET1K_V1
  url: https://download.pytorch.org/models/convnext_tiny-983f1562.pth
training:
  epochs: 30
  optimizer: adamw
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.05
  exclude_norm_bias_from_decay: true
  min_lr: 0.000001
  label_smoothing: 0.05
  grad_clip: 1.0
  amp: true
  seed: 42
  output_dir: outputs/diat_comparison_seed42_20261022/convnext_tiny_seed42_run01
