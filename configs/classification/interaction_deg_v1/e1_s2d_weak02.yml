data:
  root: datasets/DIAT-uSAT
  manifest: manifest.csv
  image_size: [288, 384]
  batch_size: 16
  num_workers: 4

model:
  backbone_name: dinov3_vits16
  weights_path: ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  hidden_dim: 224
  conv_inplane: 32
  use_sta: true
  freeze_dinov3: false
  dropout: 0.2
  sta_variant: s1_ca
  sta_bottleneck_dim: 64
  sta_adapter_stages: [conv3]
  cross_branch_interaction: true
  module_dim: 64
  interaction_direction: semantic_to_spatial
  guidance_max_ratio: 0.02

training:
  epochs: 30
  backbone_lr: 0.00001
  head_lr: 0.0003
  min_lr: 0.000001
  weight_decay: 0.05
  label_smoothing: 0.05
  grad_clip: 1.0
  amp: true
  seed: 42
  output_dir: outputs/interaction_deg_v1/e1_s2d_weak02_seed42_20261012
